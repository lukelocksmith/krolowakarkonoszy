function NoclegiIntro() {
  return (
    <section className="noclegi-intro" data-screen-label="Noclegi · Intro">
      <div className="wrap noclegi-intro-wrap">
        <div className="noclegi-intro-text">
          <span className="eyebrow">Noclegi</span>
          <h2 className="noclegi-intro-title">
            Wybierz <em>nocleg dla siebie</em>
          </h2>
          <p className="noclegi-intro-lede">
            Wybierz pokoje Standard, jeśli szukasz wygodnej bazy blisko gór, albo pokoje Premium,
            jeśli zależy Ci na&nbsp;większej przestrzeni i&nbsp;dodatkowym wyposażeniu.
            Kategorie pokoi w&nbsp;Karpaczu — do&nbsp;potwierdzenia.
          </p>
        </div>

        <div className="noclegi-preview">
          {NOCLEGI_PREVIEW.map((c) => {
            const variant = c.tag.toLowerCase();
            return (
              <div key={c.tag} className="noclegi-preview-item">
                <a href={c.href} className={`noclegi-preview-card noclegi-preview-card-${variant}`}>
                  <h3 className="noclegi-preview-title">{c.title}</h3>
                  <p className="noclegi-preview-desc">{c.desc}</p>
                  <div className="noclegi-preview-tiles">
                    {c.tiles.map((t) => (
                      <div key={t.cap} className="noclegi-preview-tile">
                        <span className="noclegi-preview-ico" aria-hidden="true">{NOC_ICONS[t.ico]}</span>
                        <span className="noclegi-preview-tile-cap">{t.cap}</span>
                      </div>
                    ))}
                  </div>
                  <span className="noclegi-preview-cta">
                    {c.cta} <IconArrow size={14}/>
                  </span>
                </a>
                <span className={`noclegi-preview-tag noclegi-preview-tag-${variant}`}>{c.tag}</span>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

/* ---------- Wspólny blok rezerwacji ---------- */
function NoclegiRezerwacja() {
  return (
    <section className="section section-cream noclegi-rez" data-screen-label="Rezerwacja">
      <div className="wrap">
        <div className="noclegi-rez-card">
          <div className="noclegi-rez-head">
            <div>
              <span className="eyebrow">Rezerwacja</span>
              <h2 style={{marginTop: 14}}>Sprawdź dostępność</h2>
              <p className="noclegi-rez-lede">
                Wybierz daty pobytu i&nbsp;preferowaną kategorię pokoju. Możesz też zadzwonić lub napisać.
              </p>
            </div>
            <div className="noclegi-rez-info">
              <span className="noclegi-rez-info-label">Widget rezerwacyjny</span>
              <span className="noclegi-rez-info-name">KW HOTEL · OSADZONY</span>
            </div>
          </div>

          <div className="hotres-placeholder noclegi-rez-widget">
            <PH label="WIDGET REZERWACJI · KW HOTEL" />
          </div>
        </div>
      </div>
    </section>
  );
}

function RoomCategory({ data, dark }) {
  return (
    <section className={`section ${dark ? "section-cream" : "section-paper"}`} id={data.id} data-screen-label={data.eyebrow}>
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="eyebrow">{data.eyebrow}</span>
            <h2 style={{marginTop: 18}}>
              {data.title}{data.titleEm ? <> <em>{data.titleEm}</em></> : null}
            </h2>
          </div>
          <div className="lead">{data.desc.split("\n\n").map((t, i) => <p key={i} style={{margin: i ? "14px 0 0" : 0}}>{t}</p>)}</div>
        </div>

        <div className="room-cat-block">
          <div className="room-cat-block-head">
            <span className="ix">01 · Galeria</span>
            <h3>Jak wyglądają</h3>
          </div>
        </div>
      </div>

      <RoomGallery items={data.gallery} roomLabel={`${data.title}${data.titleEm ? " " + data.titleEm : ""}`} />

      <div className="wrap">
        <div className="room-cat-block">
          <div className="room-amenities">
            <div className="room-cat-block-head">
              <span className="ix">02 · Wyposażenie</span>
              <h3>Wyposażenie pokoju</h3>
            </div>
            <ul>
              {data.amenities.map(a => {
                const src = AMENITY_ICON[a.icon];
                return (
                  <li key={a.text} className={a.hi ? "amenity-hi" : ""}>
                    {src ? <img src={src} alt="" /> : <IconCheck/>}
                    <div className="amenity-text">
                      <span className="amenity-name">{a.text}</span>
                      {a.note ? <p className="amenity-note">{a.note}</p> : null}
                    </div>
                  </li>
                );
              })}
            </ul>
          </div>
        </div>

        <div className="room-cat-block">
          <div className="room-pricing">
            <div className="room-cat-block-head">
              <span className="ix">03 · Typy pokoi</span>
              <h3>Typy pokoi i ceny</h3>
            </div>
            <div className="pricing-list">
              {data.pricing.map(p => (
                <div key={p.name} className="pricing-row">
                  <div className="pricing-row-main">
                    <div className="pricing-name">{p.name}</div>
                    <div className="pricing-meta-grid">
                      <span className="pricing-meta-cell">
                        <IconUsers size={14}/> {p.people} {p.people === 1 ? "osoba" : (p.people < 5 ? "osoby" : "osób")}
                      </span>
                      <span className="pricing-meta-cell"><IconRuler size={14}/> {p.area}</span>
                      <span className="pricing-meta-cell"><IconBed size={14}/> {p.beds}</span>
                    </div>
                  </div>
                  <div className="pricing-price">
                    <span className="amt">{p.price}</span>
                    <span className="per"> / noc</span>
                  </div>
                </div>
              ))}

function MaterialyDrugieZycie() {
  const featRef = useRef(null);

  useEffect(() => {
    const img = featRef.current;
    if (!img) return;
    const wrap = img.parentElement;
    let raf = null;
    const update = () => {
      raf = null;
      const docW = document.documentElement.clientWidth;
      const baseW = Math.min(1120, docW - 48);
      const vh = window.innerHeight;
      // pozycja bezwzględna górnej krawędzi obrazu na stronie
      const wrapTopAbs = wrap.getBoundingClientRect().top + window.scrollY;
      // najpierw obraz jest po prostu widoczny w rozmiarze bazowym (p=0),
      // rośnie dopiero gdy przewijasz dalej — jak zdjęcie na hero
      const start = wrapTopAbs - vh * 0.9;
      const dist = vh * 0.7;
      let p = (window.scrollY - start) / dist;
      p = Math.min(1, Math.max(0, p));
      img.style.maxWidth = "none";
      img.style.width = (baseW + (docW - baseW) * p) + "px";
      img.style.borderRadius = (8 * (1 - p)) + "px";
    };
    const onScroll = () => { if (raf == null) raf = requestAnimationFrame(update); };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section id="wnetrza" className="section section-paper mat-sec" data-screen-label="Materiały">
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="eyebrow">O obiekcie · Wnętrza</span>

              Opis wnętrz obiektu w&nbsp;Karpaczu — treść do&nbsp;uzupełnienia. Układ sekcji
              i&nbsp;kafelki z&nbsp;detalami są gotowe.
            </p>
            <p style={{marginTop: 14}}>
              Drugi akapit — do&nbsp;uzupełnienia.
            </p>
          </div>
        </div>

        <div className="mat-grid">
          {MAT_DETALE.map((d, i) => (
            <article key={d.title} className="mat-swatch">
              <div className="mat-frame">
                <img src={d.img} width="1800" height="2400" loading="lazy" alt={d.alt} style={{objectPosition: d.pos}} />
                <span className="mat-grain" aria-hidden="true" />

          <button className="gal-more gal-more-collapse" onClick={() => setExpanded(false)}>

    </section>
  );
}

/* ---------- Opinie (sekcja 16 copywritera) ----------
   Auto-scrolling slider z prawdziwymi opiniami z Google (24 szt., wybrane przez klienta). */
function Opinie() {
  const sliderRef = useRef(null);

  useEffect(() => {
    const el = sliderRef.current;
    if (!el) return;
    let paused = false;
    let isDragging = false;
    let startX = 0;
    let startScrollLeft = 0;
    let raf = null;
    let lastTs = 0;
    let acc = 0;
    const SPEED = 80;

    const onEnter = () => { paused = true; };
    const onLeave = () => { if (!isDragging) paused = false; };
    const onDown = (e) => {
      isDragging = true; paused = true;
      startX = e.pageX; startScrollLeft = el.scrollLeft;
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!isDragging) return;
      el.scrollLeft = startScrollLeft - (e.pageX - startX);
    };
    const onUp = () => { if (!isDragging) return; isDragging = false; paused = false; };
    const onTouchStart = () => { paused = true; };
    const onTouchEnd = () => { paused = false; };

    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onTouchStart, { passive: true });
    el.addEventListener("touchend", onTouchEnd, { passive: true });

    const animate = (ts) => {
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (!paused && !document.hidden && dt < 0.5) {
        acc += SPEED * dt;
        if (acc >= 1) {
          const step = Math.floor(acc);
          el.scrollLeft += step;
          acc -= step;
          if (el.scrollLeft + el.clientWidth >= el.scrollWidth - 1) {
            el.scrollLeft = 0;
          }
        }
      }
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    return () => {
      cancelAnimationFrame(raf);
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  return (
    <section id="opinie" className="section section-green" data-screen-label="Opinie">
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="eyebrow" style={{ color: "var(--beige-soft)" }}>Opinie</span>
            <h2 style={{ color: "var(--cream)", marginTop: 18 }}>Goście <em style={{ color: "var(--beige-soft)" }}>wracają tu od lat</em></h2>
          </div>
          <p className="lead" style={{ color: "rgba(245,241,234,0.78)" }}>
            Najlepsze miejsca nie potrzebują krzyczeć. Wystarczy, że ludzie wracają, polecają je dalej
            i&nbsp;zabierają ze sobą kolejnych gości. W&nbsp;Królowej Karkonoszy szczególnie cenimy tych,
            którzy przyjeżdżają ponownie. To dla nas najprostszy dowód, że miejsce działa tak, jak powinno.
          </p>
        </div>

        <div className="reviews-stats">
          <div className="reviews-stat">
            <div className="num">4.6<span>/5</span></div>
            <div className="label">średnia ocena w&nbsp;Google</div>
          </div>
          <div className="reviews-stat">
            <div className="num">914</div>

          </div>
          <div className="reviews-stat">

/* ---------- Lightbox — podgląd zdjęć (galeria + noclegi) ----------
   Otwierany zdarzeniem "open-lightbox" (detail: { images, index }),
   dzięki czemu dowolny obrazek na stronie może go wywołać przez openLightbox(). */
function openLightbox(images, index) {
  window.dispatchEvent(new CustomEvent("open-lightbox", { detail: { images, index: index || 0 } }));
}

function Lightbox() {
  const [state, setState] = useState(null);

  useEffect(() => {
    const onOpen = (e) => setState({ images: e.detail.images, index: e.detail.index || 0 });
    window.addEventListener("open-lightbox", onOpen);
    return () => window.removeEventListener("open-lightbox", onOpen);
  }, []);

  useEffect(() => {
    if (!state) return;
    const onKey = (e) => {
      if (e.key === "Escape") setState(null);
      else if (e.key === "ArrowRight") setState((s) => s && { ...s, index: (s.index + 1) % s.images.length });
      else if (e.key === "ArrowLeft") setState((s) => s && { ...s, index: (s.index - 1 + s.images.length) % s.images.length });
    };
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [state]);

  if (!state) return null;
  const { images, index } = state;
  const cur = images[index];
  if (!cur) return null;
  const many = images.length > 1;
  const go = (d, e) => { if (e) e.stopPropagation(); setState((s) => s && { ...s, index: (s.index + d + s.images.length) % s.images.length }); };

  return (
    <div className="lightbox" onClick={() => setState(null)} role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia">
      <button type="button" className="lightbox-close" onClick={() => setState(null)} aria-label="Zamknij podgląd">×</button>
      {many && <button type="button" className="lightbox-nav lightbox-prev" onClick={(e) => go(-1, e)} aria-label="Poprzednie zdjęcie">‹</button>}
      <figure className="lightbox-figure" onClick={(e) => e.stopPropagation()}>
        <img src={cur.src} alt={cur.alt || ""} />
        {many && <figcaption className="lightbox-count">{index + 1} / {images.length}</figcaption>}
      </figure>
      {many && <button type="button" className="lightbox-nav lightbox-next" onClick={(e) => go(1, e)} aria-label="Następne zdjęcie">›</button>}
    </div>
  );
}

function App() {
  // Wideo w Historii respektuje prefers-reduced-motion: bez tego autoPlay
  // ignorowal preferencje systemowa uzytkownika.
  React.useEffect(() => {
    if (!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
    document.querySelectorAll("video[autoplay]").forEach((v) => {
      v.pause();
      v.removeAttribute("loop");
    });
  }, []);

  React.useLayoutEffect(() => {
    if (typeof IntersectionObserver === "undefined") return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    // Bloki z fade + lekkim podjechaniem
    const sel = [
      ".hero-headline", ".sec-head", ".wyroz-card", ".qstrip-item", ".noclegi-preview-card",
      ".room-cat-block", ".room-gallery-wrap", ".wyz-split", ".lok-split",
      ".groups-lede", ".groups-grid", ".grp-split", ".pkg-card",
      ".gal-grid", ".spa-card", ".reviews-stats", ".reviews-slider-wrap",
      ".faq-grid", ".contact-row"
    ].join(",");
    // Historia "O nas" — tylko teksty, sam fade (bez transform, żeby nie ruszać warstw mix-blend)
    const selSoft = [
      ".hjoint-intro-text", ".hjoint-chapter-title", ".hjoint-chapter-text"
    ].join(",");

    const els = Array.prototype.slice.call(document.querySelectorAll(sel));
    const elsSoft = Array.prototype.slice.call(document.querySelectorAll(selSoft));
    els.forEach((el) => el.classList.add("reveal"));
    elsSoft.forEach((el) => el.classList.add("reveal-soft"));

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("is-visible");
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: "0px 0px -18% 0px", threshold: 0.06 });
    els.concat(elsSoft).forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  // Płynne przewijanie do sekcji z offsetem paska nav.
  // Hero ze scroll-expand rośnie w trakcie przewijania i przesuwa cel w dół, przez co
  // natywna kotwica lądowała za wcześnie. Własna animacja rAF PRZELICZA cel co klatkę
  // (śledzi rosnące hero) i na końcu dociąga dokładnie.
  React.useEffect(() => {
    const root = document.documentElement;
    const targetYFor = (el) => {
      const nav = document.querySelector(".nav");
      const off = (nav ? nav.offsetHeight : 88) + 12;
      return Math.max(0, el.getBoundingClientRect().top + window.scrollY - off);
    };
    let raf = null, cancelled = false, prevBehavior = "";
    let onUser = null, timeouts = [];
    const finish = () => {
      if (onUser) {
        window.removeEventListener("wheel", onUser);
        window.removeEventListener("touchstart", onUser);
        onUser = null;
      }
      root.style.scrollBehavior = prevBehavior;
    };
    const cancel = () => { cancelled = true; if (raf) cancelAnimationFrame(raf); timeouts.forEach(clearTimeout); timeouts = []; finish(); };
    const onDocClick = (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute("href");
      if (!href || href === "#") return;
      const el = document.querySelector(href);
      if (!el) return;
      e.preventDefault();
      if (href !== window.location.hash) history.replaceState(null, "", href);
      if (raf) cancelAnimationFrame(raf);
      cancelled = false;
      prevBehavior = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";          // sterujemy scrollem sami (bez natywnego smooth)
      const startY = window.scrollY;
      const t0 = performance.now();
      const dur = 560;
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      onUser = () => cancel();
      window.addEventListener("wheel", onUser, { passive: true });
      window.addEventListener("touchstart", onUser, { passive: true });
      const step = (now) => {
        if (cancelled) return;
        const p = Math.min(1, (now - t0) / dur);
        const dest = targetYFor(el);               // co klatkę — hero rośnie, cel się przesuwa
        window.scrollTo(0, startY + (dest - startY) * ease(p));
        if (p < 1) { raf = requestAnimationFrame(step); }
        else {
          window.scrollTo(0, targetYFor(el));
          // dogrywki: hero i pasek nav (przejście min-height .35s) mogą jeszcze
          // dokończyć ruch tuż po animacji — dociągamy po ustabilizowaniu layoutu
          timeouts.push(setTimeout(() => { if (!cancelled) window.scrollTo(0, targetYFor(el)); }, 150));
          timeouts.push(setTimeout(() => { if (!cancelled) window.scrollTo(0, targetYFor(el)); finish(); }, 440));
        }
      };
      raf = requestAnimationFrame(step);
    };
    document.addEventListener("click", onDocClick);
    return () => { document.removeEventListener("click", onDocClick); cancel(); };
  }, []);

  return (
    <>
      <a href="#main" className="skip-link">Przejdź do treści</a>
      <Nav links={NAV_LINKS} home="/index.html" />
      <main id="main">
      <Hero />
      <QuickStrip />
      <Groups />
      <span id="noclegi" className="anchor-offset" aria-hidden="true" />
      <NoclegiIntro />
      <RoomCategory data={ROOMS_STANDARD} dark={true} />
      <RoomCategory data={ROOMS_PREMIUM} dark={false} />
      {/* Ukryte na start (brak rezerwacji online) — przywrócić po uruchomieniu: */}
      {/* <NoclegiRezerwacja /> */}
      <Wyzywienie />
      <FullImageBreak />
      <Galeria />
      <Wyrozniki />
      <HistoriaTeaser />
