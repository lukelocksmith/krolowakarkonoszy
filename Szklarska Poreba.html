<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Królowa Karkonoszy · Szklarska Poręba</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
<style>
  /* ===== Page-specific: Szklarska Poreba ===== */

  /* ===== Nav override — linki bliżej logo, CTA solid (bez stroke), języki kompaktowe ===== */
  .nav-inner-szkl { gap: 36px; }
  .nav-inner-szkl .nav-center {
    flex: 0 0 auto;
    justify-content: flex-start;
    gap: 22px;
    margin-right: auto; /* push right-group to end */
  }
  /* Solid pill button, no stroke/before tricks */
  .nav-cta-outline {
    border: 0 !important;
    background: var(--beige);
    color: var(--green);
    height: 44px;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    border-radius: 999px;
    transition: background .2s ease, transform .15s ease;
    isolation: auto;
  }
  .nav-cta-outline::before { content: none !important; display: none !important; }
  .nav-cta-outline:hover { background: var(--cream); transform: translateY(-1px); }
  .nav.scrolled .nav-cta-outline { background: var(--green); color: var(--cream); border-color: transparent !important; }
  .nav.scrolled .nav-cta-outline:hover { background: var(--green-deep); }

  /* Language switcher — same height as CTA, tighter, circular active */
  /* Na zielonym tle (hero, non-scrolled) — tło i aktywny kolor zgodne z beżowym CTA */
  .nav-langs-inline {
    height: 44px;
    gap: 2px;
    padding: 4px;
    align-self: center;
    background: rgba(173, 149, 117, 0.18);
    border-color: rgba(173, 149, 117, 0.32);
  }
  .nav-lang-inline {
    height: 36px;
    width: 36px;
    min-width: 36px;
    padding: 0;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--cream);
  }
  .nav-lang-inline:hover { background: rgba(173, 149, 117, 0.18); }
  .nav-lang-inline.active {
    background: var(--beige);
    color: var(--green);
  }
  /* Scrolled — tło jasne, zgodne z zielonym CTA */
  .nav.scrolled .nav-langs-inline {
    background: rgba(42,61,49,0.08);
    border-color: rgba(42,61,49,0.16);
  }
  .nav.scrolled .nav-lang-inline { color: var(--green); }
  .nav.scrolled .nav-lang-inline:hover { background: rgba(42,61,49,0.08); }
  .nav.scrolled .nav-lang-inline.active {
    background: var(--green);
    color: var(--cream);
  }


  /* Override globalnego sec-head — układ kolumnowy zamiast 2-kolumn left/right */
  .sec-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 64px;
  }
  .sec-head > div { width: 100%; }
  /* zdejmujemy max-width 18ch z shared.css — łamanie linii kontrolujemy przez <br/> w JSX */
  .sec-head h2 { max-width: none; }
  .sec-head .lead {
    max-width: 76ch;
    font-size: 18px;
    line-height: 1.65;
    color: var(--ink-mute);
  }
  .section-green .sec-head .lead { color: rgba(245,241,234,0.78); }

  /* Hero */
  .hero {
    position: relative;
    min-height: 100vh;
    padding-top: 123px;
    color: var(--cream);
    background: var(--green-deep);
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #4a5d50 0%, #2A3D31 60%, #1F2E25 100%);
  }
  .hero-bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(31,46,37,0.45) 0%, rgba(31,46,37,0.2) 35%, rgba(31,46,37,0.85) 100%);
  }
  .hero-inner {
    position: relative;
    max-width: var(--max); margin: 0 auto;
    padding: 60px var(--gutter) 80px;
    min-height: calc(100vh - 123px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 24px;
  }
  .hero-headline { max-width: 980px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--beige-soft);
    margin-bottom: 28px;
    justify-content: center;
  }
  .hero-eyebrow svg { color: var(--beige); }
  .hero h1 {
    font-size: clamp(42px, 6vw, 88px);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--cream);
    margin-bottom: 32px;
  }
  .hero h1 em { font-style: italic; color: var(--beige-soft); font-weight: 300; }
  .hero-sub {
    font-size: clamp(17px, 1.4vw, 20px);
    font-weight: 300;
    color: rgba(245,241,234,0.85);
    max-width: 60ch;
    margin: 0 auto;
    line-height: 1.55;
  }
  .hero-foot {
    display: grid; grid-template-columns: 1fr auto; gap: 60px; align-items: end;
  }
  .hero-facts {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px;
    max-width: 760px;
    padding-top: 28px; border-top: 1px solid rgba(245,241,234,0.18);
  }
  .hero-fact .num {
    font-size: 38px; font-weight: 300; color: var(--cream);
    letter-spacing: -0.02em; line-height: 1; margin-bottom: 8px;
  }
  .hero-fact .lbl {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--beige-soft);
  }
  .hero-actions { display: flex; gap: 14px; align-items: center; }
  .hero-actions .btn-on-dark { padding: 18px 32px; }
  .hero-actions .btn-ghost-light {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 18px 28px;
    border-radius: 999px;
    border: 1px solid rgba(245,241,234,0.4);
    color: var(--cream);
    font-weight: 700; font-size: 15px;
    transition: all .2s ease;
  }
  .hero-actions .btn-ghost-light:hover { background: rgba(245,241,234,0.08); border-color: var(--cream); }

  /* Overview / "O obiekcie" */
  .overview-grid {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 100px;
    align-items: center;
  }
  .overview-img {
    aspect-ratio: 4/5;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .overview-img .ph { width: 100%; height: 100%; }
  .overview-img .badge {
    position: absolute; top: 24px; left: 24px;
    background: var(--cream);
    color: var(--green);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700;
  }
  .overview-content h2 {
    font-size: clamp(36px, 4.5vw, 60px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 32px;
  }
  .overview-content h2 em { font-style: italic; color: var(--beige); }
  .overview-content .lede {
    font-size: 19px; line-height: 1.65;
    color: var(--ink); margin-bottom: 24px;
    max-width: 42ch;
  }
  .overview-content p {
    font-size: 16px; line-height: 1.75; color: var(--ink-mute);
    margin-bottom: 18px; max-width: 48ch;
  }
  .overview-content .signature {
    margin-top: 32px;
    display: flex; align-items: center; gap: 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--beige);
  }
  .overview-content .signature .sig-img {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #d8d2c5, #AD9575);
    color: var(--cream); display: flex; align-items: center; justify-content: center;
    font-family: "Lato", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0;
  }
  .overview-content .signature small { display: block; color: var(--ink-mute); margin-top: 4px; }
  .overview-cta { margin-top: 24px; }

  /* ===== Historia (duża sekcja narracyjna) ===== */
  .historia {
    position: relative;
    background: var(--green);
    color: var(--cream);
    overflow: hidden;
  }
  .historia::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 80% 0%, rgba(173,149,117,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 0% 100%, rgba(173,149,117,0.10) 0%, transparent 50%);
    pointer-events: none;
  }
  .historia .wrap { position: relative; }
  .historia-head {
    text-align: center;
    max-width: 920px;
    margin: 0 auto 80px;
  }
  .historia-eyebrow { color: var(--beige-soft) !important; }
  .historia-title {
    font-size: clamp(40px, 5.2vw, 72px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.08;
    color: var(--cream);
    margin-top: 24px;
  }
  .historia-title em { font-style: italic; color: var(--beige-soft); font-weight: 300; }
  .historia-grid {
    display: grid;
    grid-template-columns: 0.85fr 1fr;
    gap: 90px;
    align-items: start;
  }
  .historia-visual {
    position: sticky; top: 120px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .historia-photo {
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, #3a5244 0%, #1F2E25 100%);
    border: 1px solid rgba(245,241,234,0.16);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .historia-photo .ph {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(173,149,117,0.18), rgba(31,46,37,0.6));
    color: rgba(245,241,234,0.45);
  }
  .historia-photo .historia-photo-badge {
    position: absolute; top: 20px; left: 20px;
    background: rgba(245,241,234,0.94); color: var(--green);
    padding: 8px 14px; border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
    font-weight: 700;
  }
  .historia-timeline {
    display: flex; flex-direction: column;
    border-left: 1px solid rgba(245,241,234,0.22);
    padding: 6px 0 6px 22px;
    gap: 22px;
  }
  .historia-tl-item {
    position: relative;
  }
  .historia-tl-item::before {
    content: "";
    position: absolute; left: -28px; top: 9px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--beige);
  }
  .historia-tl-year {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--beige); font-weight: 700;
  }
  .historia-tl-label {
    margin-top: 4px;
    font-size: 15px; line-height: 1.4; color: rgba(245,241,234,0.85);
  }
  .historia-body {
    font-size: 17px; line-height: 1.8;
    color: rgba(245,241,234,0.86);
    max-width: 58ch;
  }
  .historia-body p { margin-bottom: 22px; }
  .historia-body p:first-of-type {
    font-size: 21px;
    line-height: 1.6;
    color: var(--cream);
    font-weight: 300;
    margin-bottom: 30px;
  }
  .historia-pull {
    margin: 48px 0 0;
    padding: 36px 40px;
    background: rgba(245,241,234,0.05);
    border-left: 3px solid var(--beige);
    border-radius: 4px;
    font-size: 19px; line-height: 1.6;
    color: var(--cream); font-style: italic;
    font-weight: 300;
  }
  @media (max-width: 980px) {
    .historia-head { margin-bottom: 56px; }
    .historia-grid { grid-template-columns: 1fr; gap: 48px; }
    .historia-visual { position: static; }
    .historia-photo { aspect-ratio: 4/3; }
    .historia-body p:first-of-type { font-size: 19px; }
    .historia-pull { padding: 28px 24px; font-size: 17px; }
  }

  /* ===== Wyróżniki (4 kafelki) ===== */
  .wyroz-head { max-width: 880px; margin: 0 auto 64px; text-align: center; }
  .wyroz-head h2 {
    font-size: clamp(34px, 4vw, 52px);
    font-weight: 300; letter-spacing: -0.02em;
    line-height: 1.1; margin-top: 18px;
  }
  .wyroz-head h2 em { font-style: italic; color: var(--beige); font-weight: 300; }
  .wyroz-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  }
  .wyroz-card {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 36px 32px 32px;
    display: flex; flex-direction: column; gap: 16px;
    position: relative;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .wyroz-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--beige);
  }
  .wyroz-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--beige); font-weight: 700;
  }
  .wyroz-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--cream);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
  .wyroz-card h3 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .wyroz-card p {
    font-size: 15px; line-height: 1.6; color: var(--ink-mute);
    margin: 0;
  }
  @media (max-width: 1100px) {
    .wyroz-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 580px) {
    .wyroz-grid { grid-template-columns: 1fr; }
  }

  /* ===== HistoriaJoint (O nas + Historia, scroll-driven storytelling) ===== */
  .hjoint {
    position: relative;
    background: var(--green);
    color: var(--cream);
    overflow: hidden;
    isolation: isolate;
  }
  .hjoint::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 85% 5%, rgba(173,149,117,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 5% 95%, rgba(173,149,117,0.10) 0%, transparent 55%);
    pointer-events: none;
    z-index: -1;
  }

  /* INTRO (lewa) */
  .hjoint-intro {
    padding: 140px 0 64px;
    position: relative;
  }
  .hjoint-intro-wrap { text-align: left; }
  .hjoint-intro-text { max-width: 920px; text-align: left; }
  .hjoint-eyebrow { color: var(--beige-soft) !important; }
  .hjoint-intro-title {
    font-size: clamp(40px, 5.6vw, 76px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.08;
    color: var(--cream);
    margin: 24px 0 32px;
    text-align: left;
  }
  .hjoint-intro-title em {
    font-style: italic; color: var(--beige-soft); font-weight: 300;
  }
  .hjoint-intro-lede {
    font-size: clamp(18px, 1.5vw, 22px);
    line-height: 1.6;
    color: rgba(245,241,234,0.86);
    max-width: 60ch;
    font-weight: 300;
    text-align: left;
  }

  /* ===== HistoriaJoint — vertical storytelling (wg Figmy klienta) ===== */
  /* Wartości px konwertowane z Figmy. Typografia: H 64px, opis 21px (clamp dla responsive). */

  /* INTRO heading 3-linijki */
  .hjoint-intro-text { max-width: 1100px; }
  .hjoint-intro-title {
    font-size: clamp(40px, 4.6vw, 64px) !important;
  }
  .hjoint-intro-lede {
    max-width: 725px !important;
    font-size: clamp(17px, 1.6vw, 21px) !important;
  }

  /* Stage */
  .hjoint-stage { position: relative; }

  /* Stage 1: img-1 hero (1440px) + bg-img-1 startuje od połowy img-1 */
  /* Brak z-index na stage'ach żeby mix-blend-mode w bg-image działał z zielenią .hjoint.
     img-4 (w bg-content z:3) i tak jest nad bg-img-2 (w innym stage'u z:1) bo z-indexy
     porównują się w stacking contexcie .hjoint */
  .hjoint-stage-1 { padding-top: 64px; }
  .hjoint-stage-1 .hjoint-hero {
    position: relative;
    z-index: 3;
    max-width: 1440px;
    margin: 0 auto -24vw;
    padding: 0;
  }
  @media (min-width: 1440px) {
    .hjoint-stage-1 .hjoint-hero { margin-bottom: -348px; }  /* half of 696px */
  }
  .hjoint-hero-photo {
    display: block;
    width: 100%;
    max-width: 1440px;
    height: auto;
    margin: 0 auto;
  }

  /* Bg wrap z bg-image (mix-blend-mode multiply) */
  .hjoint-bg-wrap {
    position: relative;
    overflow: hidden;
    /* min-height żeby bg-img-1 (1920x1439) była w pełni widoczna */
    min-height: calc(100vw * 1439 / 1920);
  }
  @media (min-width: 1440px) {
    .hjoint-bg-wrap { min-height: 1079px; }
  }
  .hjoint-bg-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: auto;
    display: block;
    z-index: 1;
    mix-blend-mode: multiply;
    pointer-events: none;
    user-select: none;
  }
  /* Padding-top = half img-1 (348px desktop) + 126px = 474px do "Koniec XIX wieku" */
  .hjoint-bg-content {
    position: relative;
    z-index: 3;
    padding-top: calc(100vw * 348 / 1440 + 126px);
    padding-bottom: 0;
  }
  @media (min-width: 1440px) {
    .hjoint-bg-content { padding-top: 474px; }
  }

  /* Stage 2 — bg-img-2 z overlapem (zaczyna od połowy img-4) */
  /* img-4 = 1015×650 → połowa = 325px, scaled responsively jako 22.5vw */
  /* Brak z-index na Stage 2 (analogicznie jak Stage 1) — mix-blend-mode musi blendować z .hjoint */
  .hjoint-stage-2 {
    position: relative;
    overflow: hidden;
    margin-top: -22.5vw;                /* pull up to half img-4 height */
    min-height: calc(100vw * 1415 / 1920);
  }
  @media (min-width: 1440px) {
    .hjoint-stage-2 {
      margin-top: -325px;
      min-height: 1061px;
    }
  }
  .hjoint-stage-2 .hjoint-bg-content {
    padding-top: 22.5vw;               /* kompensuje negative margin — content w naturalnej pozycji */
    padding-bottom: 80px;
  }
  @media (min-width: 1440px) {
    .hjoint-stage-2 .hjoint-bg-content { padding-top: 325px; padding-bottom: 80px; }
  }

  /* Generic chapter — bez paddingów defaultowych, każdy chapter ustawia własne */
  .hjoint-chapter { padding: 0; position: relative; }
  .hjoint-chapter-center { text-align: center; }

  /* Konkretne paddingi między chapterami (px z Figmy) */
  .hjoint-chapter-1897 { padding-top: 240px; }  /* od img-3 do "Około 1897" */
  .hjoint-chapter-1905 { padding-top: 196px; }  /* od img-4 do img-5 */
  .hjoint-chapter-xx   { padding-top: 119px; }  /* od img-5 do "Początek XX wieku" */

  /* Typografia 64px headings, 21px text — clamp dla responsive */
  .hjoint-chapter-title {
    font-style: italic;
    font-weight: 300;
    font-size: clamp(36px, 4.4vw, 64px);
    color: var(--beige-soft);
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 24px;
  }
  .hjoint-chapter-text {
    font-size: clamp(17px, 1.6vw, 21px);
    line-height: 1.65;
    color: rgba(245,241,234,0.92);
    max-width: 725px;
    font-weight: 300;
    margin: 0;
  }
  .hjoint-chapter-center .hjoint-chapter-text { margin: 0 auto; }

  /* Zdjęcia — natural dimensions via HTML attrs */
  .hjoint-photo {
    display: block;
    max-width: 100%;
    height: auto;
  }

  /* Para img-2 + img-3 — gap 122px, align-items center (img-3 centered to img-2) */
  .hjoint-pair {
    display: flex;
    align-items: center;       /* img-3 vertically centered to img-2 */
    justify-content: center;
    gap: 122px;
    margin-top: 106px;          /* od description do img-2 */
    padding: 0 var(--gutter);
    flex-wrap: wrap;
  }

  /* Pair-big (img-7 + img-8) — img-7 LEFT, img-8 RIGHT, img-7 vertically centered to img-8 */
  .hjoint-pair-big {
    display: flex;
    justify-content: space-between;
    align-items: center;        /* img-7 vertically centered to img-8 */
    gap: 0;
    margin: 80px auto 0;
    max-width: 1440px;
    padding: 0 var(--gutter);
  }

  /* Stacked (1897) — text LEFT, img-4 RIGHT below, 106px gap */
  .hjoint-stacked {
    display: flex;
    flex-direction: column;
  }
  .hjoint-stacked-text {
    align-self: flex-start;
    max-width: 725px;
  }
  .hjoint-stacked-photo {
    align-self: flex-end;        /* img-4 to RIGHT side */
    margin-top: 106px;
  }

  /* Splity */
  .hjoint-split {
    display: grid;
    gap: 64px;
    align-items: center;
  }
  .hjoint-split-rt { grid-template-columns: 1fr 1.1fr; }      /* photo L, text R */

    padding-top: 2px;
  }
  .groups-point-text { display: flex; flex-direction: column; gap: 6px; }

    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--beige-soft); font-weight: 700;
  }
  .groups-point-value {
    font-size: 14px; line-height: 1.45;
    color: var(--cream);
  }

  /* ===== Galeria — z filtrami ===== */

    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 40px;
  }
  .gal-filter {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    cursor: pointer;
    transition: all .2s ease;
    font-family: inherit;
  }
  .gal-filter:hover { border-color: var(--beige); }
  .gal-filter.active {
    background: var(--green);
    color: var(--cream);
    border-color: var(--green);
  }
  .gal-filter-count {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.12em;
    color: var(--ink-mute);
    background: var(--paper);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .gal-filter.active .gal-filter-count {
    color: var(--beige-soft); background: rgba(245,241,234,0.1);
  }
  .gal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 240px;
    gap: 16px;
  }
  .gal-card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    transition: transform .25s ease;
  }
  .gal-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .gal-card .ph { width: 100%; height: 100%; }
  .gal-card-tag {
    position: absolute; top: 12px; left: 12px;
    background: rgba(42,61,49,0.92);
    color: var(--cream);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700;
  }
  .gal-more {
    display: inline-flex; align-items: center; gap: 12px;
    margin: 36px auto 0;
    padding: 16px 32px;
    background: var(--green);
    color: var(--cream);
    border: 1px solid var(--green);
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all .2s ease;
  }
  .gal-more:hover {
    background: var(--green-deep);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .gal-more-count {
    display: inline-flex; align-items: center;
    padding: 4px 10px;
    background: rgba(245,241,234,0.16);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--beige-soft);
    letter-spacing: 0.04em;
  }
  .gal-more-collapse {
    background: transparent;
    color: var(--green);
    border-color: var(--green);
  }
  .gal-more-collapse:hover {
    background: var(--green);
    color: var(--cream);
  }
  /* żeby przycisk wyśrodkować w sekcji */
  section .gal-more { display: flex; margin-left: auto; margin-right: auto; }

  /* Contact CTA — przycisk po liście kontakt-row, poza gridem */
  .contact-cta { margin-top: 36px; }
  .contact-cta .btn { display: inline-flex; }

  /* ===== Lokalizacja — editorial split: lista bez ramek + tall mapa ===== */
  .lok-split {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 56px;
    align-items: stretch;
  }
  .lok-list { display: flex; flex-direction: column; justify-content: center; }
  .lok-row {
    display: grid;
    grid-template-columns: auto auto 1fr;
    column-gap: 22px;
    align-items: center;
    padding: 26px 4px;
    border-bottom: 1px solid var(--line-soft);
  }
  .lok-row:first-child { padding-top: 0; }
  .lok-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .lok-row-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--beige);
  }
  .lok-row-icon { color: var(--beige); display: inline-flex; }
  .lok-row-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lok-row-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute); font-weight: 700;
  }
  .lok-row-value {
    font-size: 18px; line-height: 1.4; color: var(--green); font-weight: 700;
    letter-spacing: -0.005em;
  }
  .lok-map {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    min-height: 560px;
  }
  .lok-map .ph { width: 100%; height: 100%; }
  .lok-map-pill {
    position: absolute; left: 20px; bottom: 20px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: rgba(42,61,49,0.92);
    color: var(--cream);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: 0.06em;
  }
  .lok-map-pin { color: var(--beige); display: inline-flex; }

  /* ===== SPA · teaser delikatny ===== */
  .spa-teaser { padding: 80px 0; }
  .spa-card {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 0;
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    overflow: hidden;
    align-items: stretch;
  }
  .spa-card-text {
    padding: 56px 56px 52px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .spa-card-text h2 {
    font-size: clamp(28px, 3vw, 40px);
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--green);
    margin-bottom: 22px;
  }
  .spa-card-text p {
    font-size: 16px; line-height: 1.7; color: var(--ink-mute);
    margin: 0; max-width: 50ch;
  }
  .spa-card-img { min-height: 320px; }
  .spa-card-img .ph { width: 100%; height: 100%; }

  /* ===== Pakiety — overrides do shared.css ===== */
  .pkg-img { position: relative; }
  .pkg-tag {
    position: absolute; top: 16px; left: 16px;
    background: rgba(42,61,49,0.92);
    color: var(--cream);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    font-weight: 700;
  }
  .pkg-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em;
    color: var(--beige); font-weight: 700;
  }
  .pkg-foot-text {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-mute);
  }


  /* Attractions — grid kart */
  .att-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .att-card {
    background: var(--white);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: all .3s ease;
    text-decoration: none; color: inherit;
  }
  .att-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--line);
  }
  .att-card-img { aspect-ratio: 4/3; position: relative; overflow: hidden; }
  .att-card-img .ph { width: 100%; height: 100%; }
  .att-card-tag {
    position: absolute; top: 16px; left: 16px;
    background: rgba(42,61,49,0.9);
    color: var(--cream);
    padding: 6px 12px;
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700;
  }
  .att-card-body { padding: 24px 24px 26px; flex: 1; display: flex; flex-direction: column; }
  .att-card h4 {
    font-size: 21px; font-weight: 700; color: var(--green);
    margin-bottom: 8px; line-height: 1.25; letter-spacing: -0.005em;
  }
  .att-card p { font-size: 14px; color: var(--ink-mute); line-height: 1.6; flex: 1; margin-bottom: 18px; }
  .att-card-meta {
    padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .att-card-meta strong { color: var(--green); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; }

  /* Grupy zorganizowane */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }
  .group-card {
    padding: 48px 44px 40px;
    background: rgba(245,241,234,0.04);
    border: 1px solid rgba(245,241,234,0.14);
    border-radius: 8px;
    display: flex; flex-direction: column;
    transition: all .25s ease;
  }
  .group-card:hover {
    background: rgba(245,241,234,0.08);
    border-color: rgba(245,241,234,0.24);
    transform: translateY(-2px);
  }
  .group-card-icon {
    color: var(--beige);
    margin-bottom: 28px;
  }
  .group-card .ix {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--beige); margin-bottom: 20px;
    font-weight: 700;
  }

    font-size: 26px; font-weight: 700; color: var(--cream);
    margin-bottom: 18px; line-height: 1.25; letter-spacing: -0.005em;

  .group-card p {
    font-size: 15px; line-height: 1.7; color: rgba(245,241,234,0.8);
    flex: 1; margin: 0;
  }

    padding-top: 22px;
    border-top: 1px solid rgba(245,241,234,0.14);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--beige-soft);
  }

  /* Strip with quick info */
  .qstrip {
    background: var(--green);
    color: var(--cream);
    padding: 100px 0;
  }
  .qstrip-inner {
    max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 56px; align-items: start;

    margin-bottom: 28px;

    border-top: 1px solid rgba(245,241,234,0.14);

  @media (max-width: 1024px) {

    .qstrip-inner { grid-template-columns: 1fr 1fr; }
    .hero-facts { grid-template-columns: 1fr 1fr; }
    .hero-foot { grid-template-columns: 1fr; }
    .att-grid { grid-template-columns: 1fr 1fr; }
    .room-amenities ul { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 1024px) {
    .groups-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .att-grid { grid-template-columns: 1fr; }
    .room-amenities ul { grid-template-columns: 1fr; }
    .pricing-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .pricing-price { text-align: left; }
    .groups-grid { grid-template-columns: 1fr; }
  }

  .reviews-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid rgba(245,241,234,0.16);
    border-bottom: 1px solid rgba(245,241,234,0.16);
    margin: 12px 0 72px;
  }
  .reviews-stat {
    padding: 44px 40px;
    border-right: 1px solid rgba(245,241,234,0.16);
  }

  .reviews-stat .num {

  .reviews-stat .num span { font-size: 22px; color: var(--beige-soft); margin-left: 4px; letter-spacing: 0; font-weight: 300; }
  .reviews-stat .label {
    margin-top: 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(245,241,234,0.6); line-height: 1.5;
  }
  .reviews-slider-wrap {
    position: relative;
    margin: 0 calc(50% - 50vw);
    width: 100vw;
  }
  .reviews-slider {
    display: flex;
    gap: 28px;
    padding: 12px max(32px, calc((100vw - 1440px) / 2 + 32px)) 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    cursor: grab;
    user-select: none;
  }
  .reviews-slider:active { cursor: grabbing; }
  .reviews-slider::-webkit-scrollbar { display: none; }
  .reviews-slider .quote-card {
    flex: 0 0 calc((min(100vw, 1440px) - 64px - 28px) / 2);
    min-width: 320px;
    user-select: none;
  }
  @media (max-width: 800px) {
    .reviews-slider .quote-card { flex-basis: 85vw; min-width: unset; }
    .reviews-stats { grid-template-columns: 1fr; }
    .reviews-stat { border-right: none; border-bottom: 1px solid rgba(245,241,234,0.16); }
    .reviews-stat:last-child { border-bottom: none; }
  }
  .quote-card {
    position: relative;
    padding: 56px 48px 40px;
    background: rgba(245,241,234,0.04);
    border: 1px solid rgba(245,241,234,0.12);
    border-radius: 8px;
    margin: 0;
    display: flex; flex-direction: column;
  }
  .quote-card .quote-mark {
    position: absolute; top: 18px; left: 40px;
    font-family: "Lato", sans-serif; font-size: 96px; font-weight: 300;
    line-height: 1; color: var(--beige); opacity: 0.7;
    pointer-events: none;
  }
  .quote-card blockquote {
    font-size: 21px; font-weight: 300; line-height: 1.55;
    color: var(--cream); font-style: italic; margin: 0;
    letter-spacing: -0.005em;
    flex: 1;
  }
  .quote-card figcaption {
    margin-top: 36px; padding-top: 22px;
    border-top: 1px solid rgba(245,241,234,0.16);
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .quote-card figcaption .name { color: var(--beige-soft); font-weight: 700; }
  .quote-card figcaption .meta { color: rgba(245,241,234,0.5); }
</style>

  const [scrolled, setScrolled] = __useState_shared(false);

  const [hidden, setHidden] = __useState_shared(false);
  const defaultLinks = links || [

    { href: "#kontakt", label: "KONTAKT" },
  ];
  __useEffect_shared(() => {
    const onScroll = () => {
      setScrolled(window.scrollY > 80);
      const footer = document.querySelector(".footer");
      if (footer) {
        const rect = footer.getBoundingClientRect();
        setHidden(rect.top <= window.innerHeight * 0.15);
      }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <header className={`nav ${scrolled ? "scrolled" : ""} ${hidden ? "hidden" : ""}`}>
      <div className="nav-inner nav-inner-szkl">

function RoomGallery({ items }) {
  const sliderRef = useRef(null);
  useEffect(() => {
    const el = sliderRef.current;
    if (!el) return;
    let paused = false;
    let isDragging = false;
    let startX = 0;
    let startScrollLeft = 0;
    let raf = null;
    let lastTs = 0;
    let acc = 0;
    const SPEED = 60;

    const onEnter = () => { paused = true; };
    const onLeave = () => { if (!isDragging) paused = false; };
    const onDown = (e) => {
      isDragging = true; paused = true;
      startX = e.pageX; startScrollLeft = el.scrollLeft;
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!isDragging) return;
      el.scrollLeft = startScrollLeft - (e.pageX - startX);
    };
    const onUp = () => {
      if (!isDragging) return;
      isDragging = false; paused = false;
    };
    const onTouchStart = () => { paused = true; };
    const onTouchEnd = () => { paused = false; };

    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onTouchStart, { passive: true });
    el.addEventListener("touchend", onTouchEnd, { passive: true });

    const animate = (ts) => {
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (!paused && !document.hidden && dt < 0.5) {
        acc += SPEED * dt;
        if (acc >= 1) {
          const step = Math.floor(acc);
          el.scrollLeft += step;
          acc -= step;
          if (el.scrollLeft + el.clientWidth >= el.scrollWidth - 1) {
            el.scrollLeft = 0;
          }
        }
      }
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    return () => {
      cancelAnimationFrame(raf);
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  return (
    <div className="room-gallery-wrap">
      <div className="room-gallery-slider" ref={sliderRef}>
        {items.map((g, i) => (
          <div key={i} className="room-gallery-card">
            <PH label={g} />
          </div>
        ))}
      </div>
    </div>
  );
}

   Filtry zwężają wybór; po zmianie filtra znów schowane do 9. */
const GAL_INITIAL = 9;

function Galeria() {
  const [active, setActive] = useState("Wszystkie");
  const [expanded, setExpanded] = useState(false);

  useEffect(() => { setExpanded(false); }, [active]);

  const filtered = active === "Wszystkie" ? GALLERY : GALLERY.filter(g => g.cat === active);
  const visible = expanded ? filtered : filtered.slice(0, GAL_INITIAL);
  const hiddenCount = Math.max(0, filtered.length - GAL_INITIAL);

  return (
    <section className="section section-cream" id="galeria" data-screen-label="Galeria">
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="eyebrow">Galeria</span>
            <h2 style={{marginTop: 18}}>Zobacz&nbsp;<em>Królową Karkonoszy</em></h2>
          </div>
          <p className="lead">
            Pokoje to tylko część pobytu. W&nbsp;galerii pokazujemy także wnętrza, budynek, otoczenie
            i&nbsp;widoki, bo dopiero razem tworzą klimat tego miejsca.
          </p>
        </div>

        <div className="gal-filters">
          {GALLERY_CATS.map(c => (
            <button
              key={c}
              className={`gal-filter ${active === c ? "active" : ""}`}
              onClick={() => setActive(c)}
              aria-pressed={active === c}
            >
              {c}
              <span className="gal-filter-count">
                {String(c === "Wszystkie" ? GALLERY.length : GALLERY.filter(g => g.cat === c).length).padStart(2,"0")}
              </span>
            </button>
          ))}
        </div>

        <div className="gal-grid">
          {visible.map((g, i) => (
            <div key={g.label + i} className="gal-card">
              <PH label={g.label} />
              <span className="gal-card-tag">{g.cat}</span>
            </div>
          ))}
        </div>

        {hiddenCount > 0 && !expanded && (
          <button className="gal-more" onClick={() => setExpanded(true)}>
            Pokaż wszystkie zdjęcia <span className="gal-more-count">+{hiddenCount}</span>
          </button>
        )}
        {expanded && filtered.length > GAL_INITIAL && (
          <button className="gal-more gal-more-collapse" onClick={() => setExpanded(false)}>
            Zwiń galerię
          </button>
        )}
      </div>
    </section>
  );
}

/* ---------- Opinie (sekcja 16 copywritera) ----------
   Visual jak wcześniej (auto-scrolling slider), ale BEZ wymyślonych nazwisk i statystyk.
   Cytaty to placeholdery — do podmiany na opinie z Google lub ręcznie wybrane przez klienta. */
function Opinie() {
  const sliderRef = useRef(null);

  useEffect(() => {
    const el = sliderRef.current;
    if (!el) return;
    let paused = false;
    let isDragging = false;
    let startX = 0;
    let startScrollLeft = 0;
    let raf = null;
    let lastTs = 0;
    let acc = 0;
    const SPEED = 80;

    const onEnter = () => { paused = true; };
    const onLeave = () => { if (!isDragging) paused = false; };
    const onDown = (e) => {
      isDragging = true; paused = true;
      startX = e.pageX; startScrollLeft = el.scrollLeft;
      e.preventDefault();
    };
    const onMove = (e) => {
      if (!isDragging) return;
      el.scrollLeft = startScrollLeft - (e.pageX - startX);
    };
    const onUp = () => { if (!isDragging) return; isDragging = false; paused = false; };
    const onTouchStart = () => { paused = true; };
    const onTouchEnd = () => { paused = false; };

    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", onTouchStart, { passive: true });
    el.addEventListener("touchend", onTouchEnd, { passive: true });

    const animate = (ts) => {
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      if (!paused && !document.hidden && dt < 0.5) {
        acc += SPEED * dt;
        if (acc >= 1) {
          const step = Math.floor(acc);
          el.scrollLeft += step;
          acc -= step;
          if (el.scrollLeft + el.clientWidth >= el.scrollWidth - 1) {
            el.scrollLeft = 0;
          }
        }
      }
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    return () => {
      cancelAnimationFrame(raf);
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      el.removeEventListener("touchstart", onTouchStart);
      el.removeEventListener("touchend", onTouchEnd);
    };
  }, []);

  return (
    <section id="opinie" className="section section-green" data-screen-label="Opinie">
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="eyebrow" style={{ color: "var(--beige-soft)" }}>Opinie</span>
            <h2 style={{ color: "var(--cream)", marginTop: 18 }}>Goście <em style={{ color: "var(--beige-soft)" }}>wracają tu od lat</em></h2>
          </div>
          <p className="lead" style={{ color: "rgba(245,241,234,0.78)" }}>
            Najlepsze miejsca nie potrzebują krzyczeć. Wystarczy, że ludzie wracają, polecają je dalej
            i&nbsp;zabierają ze sobą kolejnych gości. W&nbsp;Królowej Karkonoszy szczególnie cenimy tych,
            którzy przyjeżdżają ponownie. To dla nas najprostszy dowód, że miejsce działa tak, jak powinno.
          </p>
        </div>

        <div className="reviews-stats">
          <div className="reviews-stat">
            <div className="num">4.6<span>/5</span></div>
            <div className="label">średnia ocena w&nbsp;Google</div>
          </div>
          <div className="reviews-stat">
            <div className="num">914</div>
            <div className="label">opinii w&nbsp;Google</div>
          </div>
          <div className="reviews-stat">
            <div className="num">100<span>%</span></div>
            <div className="label">recenzji od prawdziwych gości</div>
          </div>
        </div>
      </div>

      <div className="reviews-slider-wrap">
        <div className="reviews-slider" ref={sliderRef}>
          {REVIEWS_PLACEHOLDERS.map((r, i) => (
            <figure className="quote-card" key={i}>
              <div className="quote-mark" aria-hidden="true">&ldquo;</div>
              <blockquote>{r.text}</blockquote>
              <figcaption>
                <span className="name">Opinia · wkrótce</span>
                <span className="meta">{r.tag}</span>
