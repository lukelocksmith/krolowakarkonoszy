<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Królowa Karkonoszy · Obozy i wyjazdy dla dzieci</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/krolowa-karkonoszy/shared.css?v=20260911" />
<style>
  /* ===== Page-specific: Grupy / Obozy i wyjazdy dla dzieci ===== */

  /* --- Nav override (kopia ze Szklarskiej, żeby header był spójny) --- */
  .nav-inner-szkl { gap: 36px; }
  .nav-inner-szkl .nav-center {
    flex: 0 0 auto; justify-content: flex-start; gap: 22px; margin-right: auto;
  }
  .nav-cta-outline {
    border: 0 !important; background: var(--beige); color: var(--green);
    height: 44px; padding: 0 24px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em; border-radius: 999px;
    transition: background .2s ease, transform .15s ease; isolation: auto;
  }
  .nav-cta-outline::before { content: none !important; display: none !important; }
  .nav-cta-outline:hover { background: var(--cream); transform: translateY(-1px); }
  .nav.scrolled .nav-cta-outline { background: var(--green); color: var(--cream); border-color: transparent !important; }
  .nav.scrolled .nav-cta-outline:hover { background: var(--green-deep); }

  .nav-langs-inline {
    height: 44px; gap: 2px; padding: 4px; align-self: center;
    background: rgba(173,149,117,0.18); border-color: rgba(173,149,117,0.32);
  }
  .nav-lang-inline {
    height: 44px; width: 44px; min-width: 44px; padding: 0; border-radius: 999px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
    display: inline-flex; align-items: center; justify-content: center; color: var(--cream);
  }
  .nav-lang-inline:hover { background: rgba(173,149,117,0.18); }
  .nav-lang-inline.active { background: var(--beige); color: var(--green); }
  .nav.scrolled .nav-langs-inline {
    background: rgba(42,61,49,0.08); border-color: rgba(42,61,49,0.16);
  }
  .nav.scrolled .nav-lang-inline { color: var(--green); }
  .nav.scrolled .nav-lang-inline:hover { background: rgba(42,61,49,0.08); }
  .nav.scrolled .nav-lang-inline.active { background: var(--green); color: var(--cream); }

  /* --- Hero --- */
  .grp-hero {
    position: relative; color: var(--cream);
    background: var(--green-deep); overflow: hidden;
  }
  .grp-hero-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #4a5d50 0%, #2A3D31 60%, #1F2E25 100%);
  }
  .grp-hero-bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(31,46,37,0.45) 0%, rgba(31,46,37,0.2) 35%, rgba(31,46,37,0.85) 100%);
  }
  .grp-hero-inner {
    position: relative; max-width: var(--max); margin: 0 auto;
    padding: 60px var(--gutter) 80px;
    min-height: calc(100vh - 123px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 24px;
  }
  .grp-hero-back {
    position: absolute; top: 148px; left: var(--gutter); /* pod stalym nav (~123px), nie w jego pasmie */
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--beige-soft); text-decoration: none; opacity: .85;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .grp-hero-back:hover { opacity: 1; }
  .grp-hero-back::before { content: "←"; font-size: 14px; }
  @media (max-width: 900px) {
    /* nav mobilny jest niższy (ok. 73px) niż desktopowy (123px) — bez tego link
       "Wróć do grup" nachodził na nagłówek H1, bo tekst na wąskim ekranie
       zaczyna się wyżej. */
    .grp-hero-back { top: 90px; font-size: 10px; }
  }
  .grp-hero-eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--beige-soft); margin-bottom: 28px; justify-content: center;
  }
  .grp-hero h1 {
    font-size: clamp(42px, 6vw, 88px); font-weight: 300; line-height: 1.05;
    letter-spacing: -0.02em; color: var(--cream); margin-bottom: 32px;
    max-width: 980px;
  }
  .grp-hero h1 em { font-style: italic; color: var(--beige-soft); font-weight: 300; }
  .grp-hero-sub {
    font-size: clamp(17px, 1.4vw, 20px); font-weight: 300;
    color: rgba(245,241,234,0.85); max-width: 62ch; margin: 0 auto;
    line-height: 1.55;
  }
  .grp-hero-cta { display: inline-flex; gap: 16px; margin-top: 36px; flex-wrap: wrap; justify-content: center; }
  .grp-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 28px; font-size: 14px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 999px; text-decoration: none;
    transition: background .2s, transform .15s, border-color .2s;
  }
  .grp-btn-primary { background: var(--beige); color: var(--green); }
  .grp-btn-primary:hover { background: var(--cream); transform: translateY(-1px); }
  .grp-btn-ghost { background: transparent; color: var(--cream); border: 1px solid rgba(245,241,234,0.4); }
  .grp-btn-ghost:hover { background: rgba(245,241,234,0.08); border-color: rgba(245,241,234,0.7); }

  /* --- Sekcje (paper / green) --- */
  .grp-section { padding: 120px 0; }
  .grp-section-paper { background: var(--cream); }
  .grp-section-green { background: var(--green); color: var(--cream); }
  .grp-section-head {
    display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
    align-items: end; margin-bottom: 80px;
  }
  .grp-section-head .eyebrow { color: var(--beige-ink, #7d6b54); }
  .grp-section-green .grp-section-head .eyebrow { color: var(--beige-soft); }
  .grp-section h2 {
    font-size: clamp(36px, 4.2vw, 60px); font-weight: 300;
    line-height: 1.1; letter-spacing: -0.02em;
  }
  .grp-section-green h2 { color: var(--cream); }
  .grp-section h2 em { font-style: italic; color: var(--beige); font-weight: 300; }
  .grp-section-green h2 em { color: var(--beige-soft); }
  .grp-section .lead {
    font-size: 18px; line-height: 1.6;
    color: var(--ink-mute); max-width: 60ch;
  }
  .grp-section-green .lead { color: rgba(245,241,234,0.75); }
  @media (max-width: 900px) { .grp-section-head { grid-template-columns: 1fr; gap: 32px; } }

  /* --- WhyUs grid (4 kafelki w stylu Wyróżników) --- */
  .grp-why-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  }
  .grp-why-card {
    background: var(--white); border: 1px solid var(--line-soft);
    border-radius: 6px; padding: 36px 28px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .grp-why-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.2em; color: var(--beige);
    font-weight: 700;
  }
  .grp-why-icon { width: 64px; height: 64px; }
  .grp-why-icon img { width: 64px; height: 64px; display: block; }
  .grp-why-card h3 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25;
  }
  .grp-why-card p {
    font-size: 15px; line-height: 1.6; color: var(--ink-mute); margin: 0;
  }
  @media (max-width: 1100px) { .grp-why-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 580px) { .grp-why-grid { grid-template-columns: 1fr; } }

  /* --- Offering split (kopia struktury Wyzywienia) --- */
  .grp-offer-split {
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 80px;
    align-items: stretch;
  }
  .grp-offer-photo {
    position: relative; min-height: 560px;
    border-radius: 8px; overflow: hidden;
    background: var(--cream-deep);
  }
  .grp-offer-photo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .grp-offer-photo-tag {
    position: absolute; bottom: 24px; left: 24px;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(31,46,37,0.7); color: var(--cream);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .grp-offer-list { display: flex; flex-direction: column; justify-content: center; }
  .grp-offer-row {
    display: grid;
    grid-template-columns: auto auto 1fr;
    column-gap: 20px;
    padding: 26px 4px; border-bottom: 1px solid var(--line-soft);
  }
  .grp-offer-row:first-child { padding-top: 0; }
  .grp-offer-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .grp-offer-row-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--beige); letter-spacing: 0.2em;
    align-self: center; font-weight: 700;
  }
  .grp-offer-row-icon { color: var(--beige); display: inline-flex; align-self: center; }
  .grp-offer-row-icon img {
    width: 32px; height: 32px; object-fit: contain; display: block;
  }
  .grp-offer-row-text { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .grp-offer-row-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--beige); font-weight: 700;
  }
  .grp-offer-row-value { font-size: 17px; line-height: 1.5; color: var(--ink); }
  @media (max-width: 900px) {
    .grp-offer-split { grid-template-columns: 1fr; gap: 32px; }
    .grp-offer-photo { min-height: 360px; }
  }

  /* --- Galeria grid --- */
  .grp-gallery-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .grp-gallery-item {
    aspect-ratio: 4/3; border-radius: 6px; overflow: hidden;
    background: var(--cream-deep);
  }
  .grp-gallery-item img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .4s ease;
  }
  .grp-gallery-item:hover img { transform: scale(1.04); }
  @media (max-width: 800px) { .grp-gallery-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .grp-gallery-grid { grid-template-columns: 1fr; } }

  /* --- CTA contact --- */
  .grp-cta {
    display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
    align-items: center;
  }
  .grp-cta h2 { color: var(--cream); }
  .grp-cta-text { font-size: 17px; line-height: 1.6; color: rgba(245,241,234,0.75); margin: 24px 0 32px; }
  .grp-cta-points { display: flex; flex-direction: column; gap: 12px; }
  .grp-cta-point {
    display: flex; align-items: center; gap: 14px;
    font-size: 15px; color: var(--cream);
  }
  .grp-cta-point a { color: var(--cream); text-decoration: none; }
  .grp-cta-point a:hover { color: var(--beige-soft); }
  .grp-cta-point-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--beige-soft); min-width: 90px;
  }
  .grp-cta-actions { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; margin-top: 32px; }
  @media (max-width: 900px) { .grp-cta { grid-template-columns: 1fr; gap: 32px; } }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* =====================================================================
   GROUP_DATA — dane podstrony. Aby utworzyć szablon dla innej grupy
   (Konferencje / Seniorzy), skopiuj ten plik i podmień TYLKO ten obiekt
   oraz tag <title> w <head>. Reszta zostaje bez zmian.
   ===================================================================== */
const GROUP_DATA = {
  tag: "Obozy",
  pageTitle: "Obozy i wyjazdy dla dzieci",
  hero: {
    h1pre: "Obozy i wyjazdy",
    h1em:  "dla dzieci i młodzieży",
    sub: "Pojemność obiektu, sąsiedztwo Centrum Rekreacji i Sportu „Orlik\" oraz wygodna baza wypadowa w Karkonosze. Królowa Karkonoszy w Szklarskiej Porębie sprawdza się przy obozach sportowych, językowych, kolonijnych i wyjazdach grup szkolnych.",
  },
  whyUs: [
    { icon: "/krolowa-karkonoszy/dzieci.svg",     title: "Dla dzieci i młodzieży",
      text: "Spokojne, bezpieczne otoczenie z dala od ulicznego ruchu. Sąsiedztwo Centrum Rekreacji i Sportu „Orlik\", boiska, ścieżki spacerowe w zasięgu krótkiego marszu." },
    { icon: "/krolowa-karkonoszy/bed-1.svg",      title: "Pojemność i pokoje",
      text: "96 pokoi w dwóch częściach obiektu (50 + 46). Pokoje 1-, 2-, 3- i 4-osobowe oraz studia przechodnie — wygodne ułożenie grupy z opiekunami." },
    { icon: "/krolowa-karkonoszy/sniadania.svg",  title: "Wyżywienie na miejscu",
      text: "Sala restauracyjna w obiekcie. Śniadania w formie bufetu i obiadokolacje — bez codziennego organizowania posiłków na mieście." },
    { icon: "/krolowa-karkonoszy/gory.svg",       title: "Baza wypadowa w góry",
      text: "Blisko Szrenicy, Śnieżnych Kotłów i Wysokiego Kamienia. Karkonoski Park Narodowy w krótkim zasięgu — łatwa logistyka jednodniowych wycieczek." },
  ],
  offering: {
    photo: "/krolowa-karkonoszy/IMG_9118.JPG",
    photoTag: "Sala restauracyjna",
    items: [
      { icon: "/krolowa-karkonoszy/bed-2.svg",        label: "Noclegi",       value: "Pokoje 1-, 2-, 3-, 4-osobowe oraz studia przechodnie 2+2 i 2+3 dla większych grup z opiekunami" },
      { icon: "/krolowa-karkonoszy/stol.svg",         label: "Wyżywienie",    value: "Śniadania bufet i obiadokolacje w sali restauracyjnej na miejscu. Możliwość obsługi grup z różnym rytmem dnia" },
      { icon: "/krolowa-karkonoszy/location-1.svg",   label: "Parking i dojazd", value: "Bezpłatny parking przy obiekcie dla aut osobowych i autokarów. Bliskość dworca PKP Szklarska Poręba Górna" },
      { icon: "/krolowa-karkonoszy/wypadowy.svg",     label: "Baza wypadowa", value: "Karkonosze, Góry Izerskie, Centrum Sportu „Orlik\" w sąsiedztwie. Wygodna logistyka programu obozu" },
    ],
  },
  gallery: [
    "/krolowa-karkonoszy/IMG_9118.JPG",
    "/krolowa-karkonoszy/IMG_9150.JPG",
    "/krolowa-karkonoszy/IMG_0298.JPG",
    "/krolowa-karkonoszy/36d9fe21-a90f-47b5-91b7-45d3d8370ffd.jpg",
    "/krolowa-karkonoszy/00801.jpg",
    "/krolowa-karkonoszy/m_0007_halny.jpg",
  ],
  cta: {
    h2pre: "Zaplanujmy pobyt",
    h2em:  "Twojej grupy",
    text: "Skontaktuj się z nami, żeby ustalić termin, liczbę miejsc i szczegóły programu. Odpowiemy szybko i konkretnie.",
    contact: [
      { label: "Telefon",   value: "+48 600 886 172", href: "tel:+48600886172" },
      { label: "Telefon",   value: "+48 606 503 279", href: "tel:+48606503279" },
      { label: "Email",     value: "krolowakarkonoszy@wp.pl", href: "mailto:krolowakarkonoszy@wp.pl" },
      { label: "Adres",     value: "ul. Słowackiego 11a, Szklarska Poręba" },
    ],
  },
};

/* ===== Nav (klon z głównej strony) ===== */
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [lang, setLang]         = useState("PL");
  const [menuOpen, setMenuOpen] = useState(false);
  const LINKS = [
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#o-nas",   label: "O NAS" },
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#noclegi", label: "NOCLEGI" },
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#grupy",   label: "GRUPY" },
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#galeria", label: "GALERIA" },
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#okolica", label: "OKOLICA" },
    { href: "/krolowa-karkonoszy/szklarska-poreba.html#kontakt", label: "KONTAKT" },
  ];
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 80);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  // Menu mobilne: blokada scrolla, Esc zamyka, powrót na desktop zamyka
  useEffect(() => {
    document.body.classList.toggle("nav-locked", menuOpen);
    if (!menuOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setMenuOpen(false); };
    const onResize = () => { if (window.innerWidth > 1199) setMenuOpen(false); };
    window.addEventListener("keydown", onKey);
    window.addEventListener("resize", onResize);
    return () => {
      window.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", onResize);
    };
  }, [menuOpen]);
  useEffect(() => () => document.body.classList.remove("nav-locked"), []);
  const closeMenu = () => setMenuOpen(false);
  return (
    <>
      <header className={`nav ${scrolled ? "scrolled" : ""} ${menuOpen ? "menu-open" : ""}`}>
        <div className="nav-inner nav-inner-szkl">
          <a href="/krolowa-karkonoszy/szklarska-poreba.html" className="nav-logo nav-logo-left" aria-label="Królowa Karkonoszy">
            <img className="full" src="/krolowa-karkonoszy/logo.svg" alt="Królowa Karkonoszy" />
            <img className="mark" src="/krolowa-karkonoszy/logomark.svg" alt="Królowa Karkonoszy" />
            <img className="dark" src="/krolowa-karkonoszy/logo-dark.svg" alt="" aria-hidden="true" />
          </a>
          <nav className="nav-links nav-center" aria-label="Sekcje">
            {LINKS.map(l => (
              <a key={l.href} className="nav-link" href={l.href}>{l.label}</a>
            ))}
          </nav>
          <div className="nav-right-group">
            <nav className="nav-langs-inline" aria-label="Języki">
              {["PL","EN","DE","CZ"].map(l => (
                <button key={l}
                  className={`nav-lang-inline ${l===lang?"active":""}`}
                  onClick={() => setLang(l)}
                  aria-pressed={l===lang}>{l}</button>
              ))}
            </nav>
            <a className="nav-cta-outline" href="#cta">ZAPYTAJ O POBYT</a>
          </div>
          <button
            type="button"
            className={`nav-burger ${menuOpen ? "is-open" : ""}`}
            onClick={() => setMenuOpen(o => !o)}
            aria-expanded={menuOpen}
            aria-controls="nav-mobile-panel"
            aria-label={menuOpen ? "Zamknij menu" : "Otwórz menu"}
          >
            <span className="nav-burger-box" aria-hidden="true"><span /><span /><span /></span>
          </button>
        </div>
      </header>

      <div
        className={`nav-mobile-backdrop ${menuOpen ? "is-open" : ""}`}
        onClick={closeMenu}
        aria-hidden="true"
      />
      <div
        id="nav-mobile-panel"
        className={`nav-mobile-panel ${menuOpen ? "is-open" : ""}`}
        aria-hidden={!menuOpen}
      >
        <nav className="nav-mobile-links" aria-label="Sekcje">
          {LINKS.map(l => (
            <a key={l.href} className="nav-mobile-link" href={l.href} onClick={closeMenu}>{l.label}</a>
          ))}
        </nav>
        <div className="nav-mobile-foot">
          <nav className="nav-langs-inline" aria-label="Języki">
            {["PL","EN","DE","CZ"].map(l => (
              <button key={l}
                className={`nav-lang-inline ${l===lang?"active":""}`}
                onClick={() => setLang(l)}
                aria-pressed={l===lang}>{l}</button>
            ))}
          </nav>
          <a className="nav-cta-outline" href="#cta" onClick={closeMenu}>ZAPYTAJ O POBYT</a>
        </div>
      </div>
    </>
  );
}

/* ===== Hero ===== */
function Hero() {
  const h = GROUP_DATA.hero;
  return (
    <section className="grp-hero">
      <div className="grp-hero-bg" aria-hidden="true" />
      <a className="grp-hero-back" href="/krolowa-karkonoszy/szklarska-poreba.html#grupy">Wróć do Grup</a>
      <div className="grp-hero-inner">
        <div className="grp-hero-eyebrow">GRUPY ZORGANIZOWANE · {GROUP_DATA.tag.toUpperCase()}</div>
        <h1>{h.h1pre} <em>{h.h1em}</em></h1>
        <p className="grp-hero-sub">{h.sub}</p>
